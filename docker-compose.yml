services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: concurso_ti
      POSTGRES_USER: concurso
      POSTGRES_PASSWORD: concurso_local
      TZ: America/Fortaleza
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurso -d concurso_ti"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/concurso_ti
      SPRING_DATASOURCE_USERNAME: concurso
      SPRING_DATASOURCE_PASSWORD: concurso_local
      TZ: America/Fortaleza
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
